# "Borda" local: faz o papel do DNS/Load Balancer global de uma nuvem.
# Clientes falam sempre com :8090. Se o primário morrer, o HAProxy detecta pelo
# health check e passa a enviar tráfego ao DR, sem o cliente mudar nada.
global
    log stdout format raw local0

# Resolver DNS do Docker: sem isto o HAProxy resolve os nomes UMA vez, no start.
# Se um cluster for parado e religado (IP novo), ele continuaria apontando para
# o IP velho. Com o resolver, o IP é reavaliado continuamente.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

defaults
    mode http
    log global
    timeout connect 2s
    timeout client  30s
    timeout server  30s

frontend edge
    bind *:8090
    default_backend aegis

backend aegis
    # Health check na API real (não só TCP): um cluster com o Traefik de pé mas
    # sem aplicação (DR em "luz piloto") responde 503/404 e fica marcado como DOWN.
    option httpchk
    http-check send meth GET uri /api/auctions hdr Host aegis.localhost
    http-check expect status 200

    # init-addr ...,none: o HAProxy sobe mesmo que um dos clusters não exista/esteja parado.
    default-server init-addr last,libc,none resolvers docker

    # fall 2 / inter 2s: após ~4 s de falhas, tira o servidor da rotação.
    server prod k3d-aegis-prod-serverlb:80 check inter 2s fall 2 rise 2
    # "backup": só recebe tráfego quando TODOS os servidores normais estão DOWN.
    server dr   k3d-aegis-dr-serverlb:80   check inter 2s fall 2 rise 2 backup
