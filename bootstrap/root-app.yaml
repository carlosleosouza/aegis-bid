# Application "raiz" (padrão app-of-apps). É a ÚNICA coisa aplicada à mão no
# cluster. Ela observa platform/apps/ no Git; tudo o que for commitado lá vira
# um ApplicationSet/Application, e tudo o que estiver lá é entregue pelo Argo CD.
#
# O placeholder __GITHUB_OWNER__ é trocado por `make configure OWNER=seu-usuario`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegis-root
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/__GITHUB_OWNER__/aegis-bid.git
    targetRevision: main
    path: platform/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true       # remove do cluster o que foi removido do Git
      selfHeal: true    # desfaz alterações manuais (kubectl edit) em minutos
    syncOptions: [CreateNamespace=true]
