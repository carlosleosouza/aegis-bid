data:
  saude-do-leilao.json: "{\n  \"uid\": \"aegis-saude-leilao\",\n  \"title\": \"AEGIS-Bid: Saúde do Leilão\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"refresh\": \"10s\",\n  \"time\": {\n    \"from\": \"now-30m\",\n    \"to\": \"now\"\n  },\n  \"tags\": [\n    \"aegis-bid\",\n    \"slo\"\n  ],\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"type\": \"stat\",\n      \"title\": \"Error budget restante (30 dias)\",\n      \"description\": \"1 = intacto, 0 = esgotado. Abaixo de 20% o Error Budget Gate bloqueia features.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 8,\n        \"h\": 5\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"aegis:error_budget_remaining:ratio\",\n          \"legendFormat\": \"{{slo}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"red\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 0.2\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 0.5\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 2,\n      \"type\": \"timeseries\",\n      \"title\": \"Burn rate da disponibilidade (1 = ritmo sustentável)\",\n      \"description\": \"14,4 = dispara o alerta de page (2% do budget em 1 h).\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 8,\n        \"y\": 0,\n        \"w\": 8,\n        \"h\": 5\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"aegis:sli_error:ratio_rate1h{slo=\\\"bid-availability\\\"} / 0.001\",\n          \"legendFormat\": \"janela 1h\",\n          \"refId\": \"A\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"aegis:sli_error:ratio_rate5m{slo=\\\"bid-availability\\\"} / 0.001\",\n          \"legendFormat\": \"janela 5m\",\n          \"refId\": \"B\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {},\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 3,\n      \"type\": \"timeseries\",\n      \"title\": \"Lances por segundo (por desfecho)\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 16,\n        \"y\": 0,\n        \"w\": 8,\n        \"h\": 5\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum by (outcome) (rate(aegis_bids_total[1m]))\",\n          \"legendFormat\": \"{{outcome}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 4,\n      \"type\": \"timeseries\",\n      \"title\": \"Latência da API de lances (p50 / p95 / p99)\",\n      \"description\": \"O SLO exige p99 abaixo de 0,3 s.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 5,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"histogram_quantile(0.5, sum by (le) (rate(aegis_http_request_duration_seconds_bucket{service=\\\"bid-svc\\\",route=\\\"/api/bids\\\"}[1m])))\",\n          \"legendFormat\": \"p50\",\n          \"refId\": \"A\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(aegis_http_request_duration_seconds_bucket{service=\\\"bid-svc\\\",route=\\\"/api/bids\\\"}[1m])))\",\n          \"legendFormat\": \"p95\",\n          \"refId\": \"B\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"histogram_quantile(0.99, sum by (le) (rate(aegis_http_request_duration_seconds_bucket{service=\\\"bid-svc\\\",route=\\\"/api/bids\\\"}[1m])))\",\n          \"legendFormat\": \"p99\",\n          \"refId\": \"C\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 5,\n      \"type\": \"timeseries\",\n      \"title\": \"Taxa de erro 5xx da API de lances\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 5,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum(rate(aegis_http_requests_total{service=\\\"bid-svc\\\",route=\\\"/api/bids\\\",code=~\\\"5..\\\"}[1m])) / sum(rate(aegis_http_requests_total{service=\\\"bid-svc\\\",route=\\\"/api/bids\\\"}[1m]))\",\n          \"legendFormat\": \"5xx\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\"\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 6,\n      \"type\": \"timeseries\",\n      \"title\": \"Fila x réplicas x frescor (a história do KEDA)\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 13,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"aegis_settlement_pending_entries\",\n          \"legendFormat\": \"pendentes (sem XACK)\",\n          \"refId\": \"A\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"kube_deployment_status_replicas{namespace=\\\"aegis\\\",deployment=\\\"settlement-svc\\\"}\",\n          \"legendFormat\": \"réplicas do settlement\",\n          \"refId\": \"B\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"histogram_quantile(0.99, sum by (le) (rate(aegis_settlement_lag_seconds_bucket[1m])))\",\n          \"legendFormat\": \"p99 do atraso (s)\",\n          \"refId\": \"C\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {},\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 7,\n      \"type\": \"timeseries\",\n      \"title\": \"Tráfego por versão do bid-svc (canary visível)\",\n      \"description\": \"Durante um rollout aparecem duas séries: estável e canary.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 13,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum by (rollouts_pod_template_hash) (rate(aegis_http_requests_total{service=\\\"bid-svc\\\",route=\\\"/api/bids\\\"}[1m]))\",\n          \"legendFormat\": \"{{rollouts_pod_template_hash}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 8,\n      \"type\": \"timeseries\",\n      \"title\": \"Reinícios de containers (namespace aegis)\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 21,\n        \"w\": 12,\n        \"h\": 6\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\\\"aegis\\\"}[5m]))\",\n          \"legendFormat\": \"{{pod}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {},\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 9,\n      \"type\": \"timeseries\",\n      \"title\": \"Duplicatas suprimidas pelo settlement (idempotência em ação)\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 21,\n        \"w\": 12,\n        \"h\": 6\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"\
    type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum(rate(aegis_settlement_processed_total{result=\\\"duplicate\\\"}[1m]))\",\n          \"legendFormat\": \"duplicate/s\",\n          \"refId\": \"A\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum(rate(aegis_bids_total{outcome=\\\"replayed\\\"}[1m]))\",\n          \"legendFormat\": \"replays barrados na API/s\",\n          \"refId\": \"B\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"ops\"\n        },\n        \"overrides\": []\n      }\n    }\n  ]\n}"
