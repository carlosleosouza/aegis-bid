apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: {kind: Deployment, name: redis}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: ["--appendonly", "yes", "--save", "", "--protected-mode", "no",
                "--replicaof", "k3d-aegis-prod-server-0", "30379"]
