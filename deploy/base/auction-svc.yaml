apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction-svc
  labels: {app: auction-svc, app.kubernetes.io/part-of: aegis-bid, aegis/owner: plataforma}
spec:
  replicas: 2
  selector:
    matchLabels: {app: auction-svc}
  template:
    metadata:
      labels: {app: auction-svc, app.kubernetes.io/part-of: aegis-bid, aegis/owner: plataforma}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: auction
          image: ghcr.io/carlosleosouza/aegis-bid/auction:dev
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: REDIS_URL, value: "redis://redis:6379/0"}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auction-svc
  labels: {app: auction-svc, app.kubernetes.io/part-of: aegis-bid}
spec:
  selector: {app: auction-svc}
  ports:
    - {name: http, port: 8000, targetPort: http}
