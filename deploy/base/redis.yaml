# Redis: fila (stream), idempotência e estado dos leilões.
# emptyDir => os dados somem se o pod for recriado em outro nó. É proposital no
# lab (menos peças), e vira assunto de entrevista: o que seria preciso para
# durabilidade? (PVC + AOF; ou Redis gerenciado). No DR, a réplica (fase 8)
# reduz o RPO.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {app: redis, app.kubernetes.io/part-of: aegis-bid, aegis/owner: plataforma}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis, app.kubernetes.io/part-of: aegis-bid, aegis/owner: plataforma}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7-alpine
          # --protected-mode no: LAB ONLY. Sem senha, o Redis recusaria conexões de fora do pod.
          # O isolamento vem da rede Docker + NetworkPolicy (fase 7). Em produção: ACL/senha + TLS.
          args: ["--appendonly", "yes", "--save", "", "--protected-mode", "no"]
          ports: [{name: redis, containerPort: 6379}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {app: redis, app.kubernetes.io/part-of: aegis-bid}
spec:
  selector: {app: redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
