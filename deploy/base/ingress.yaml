# Roteamento por caminho no Traefik (embutido no k3s).
# aegis.localhost resolve para 127.0.0.1 nos navegadores modernos; com curl,
# use: curl -H 'Host: aegis.localhost' http://localhost:8090/...
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis
  labels: {app.kubernetes.io/part-of: aegis-bid}
spec:
  ingressClassName: traefik
  rules:
    - host: aegis.localhost
      http:
        paths:
          - path: /api/bids
            pathType: Prefix
            backend: {service: {name: bid-svc, port: {name: http}}}
          - path: /api/auctions
            pathType: Prefix
            backend: {service: {name: auction-svc, port: {name: http}}}
